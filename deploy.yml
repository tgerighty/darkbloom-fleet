name: darkbloom-fleet
slug: darkbloom-fleet
image: zillon/darkbloom-fleet
dockerfile: Dockerfile
compose: deploy/stack.yml
stack: darkbloom-fleet
environment: platform
compose_dest: /mnt/gluster/scripts/darkbloom-fleet/
convergence_timeout: 420
stack_lint: true
secrets:
  - darkbloom_fleet_db_password
  - darkbloom_fleet_ssh_key
  - darkbloom_fleet_ssh_config
  - darkbloom_fleet_ssh_known_hosts
  - darkbloom_fleet_api_key
