<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkbloom-fleet</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem;
         background: light-dark(#f7f7f8, #17181c); color: light-dark(#1c1d21, #e7e8ea); }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  .sub { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.4rem; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; }
  .badge.observe { background: #2b6cb033; color: #2b6cb0; }
  .badge.live { background: #c0392b33; color: #c0392b; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.65; margin-bottom: 0.6rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid light-dark(#0002, #fff2); }
  th { opacity: 0.6; font-weight: 500; }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
  .bar-label { width: 12rem; font-size: 0.85rem; flex-shrink: 0; }
  .bar-track { flex: 1; background: light-dark(#0001, #fff1); border-radius: 4px; height: 0.9rem; overflow: hidden; }
  .bar-fill { height: 100%; background: light-dark(#2b6cb0, #5a9fe0); }
  .kpis { display: flex; gap: 2rem; }
  .kpi .value { font-size: 1.6rem; font-weight: 600; }
  .kpi .label { font-size: 0.8rem; opacity: 0.65; }
  .err { color: #c0392b; }
  code { font-size: 0.85em; }
</style>
</head>
<body>
  <h1 id="title">darkbloom-fleet</h1>
  <div class="sub" id="subtitle">loading…</div>

  <div class="kpis">
    <div class="kpi"><div class="value" id="kpi-current">–</div><div class="label">current model</div></div>
    <div class="kpi"><div class="value" id="kpi-earned-24h">–</div><div class="label">$ earned / 24h</div></div>
    <div class="kpi"><div class="value" id="kpi-earned-1h">–</div><div class="label">$ earned / 1h</div></div>
  </div>

  <section>
    <h2>Live demand</h2>
    <table id="demand-table">
      <thead><tr><th>model</th><th>active</th><th>warm</th><th>pressure</th><th>$/M</th><th>score</th><th>ema (20m)</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Serving percentage (24h)</h2>
    <div id="serving-bars"></div>
  </section>

  <section>
    <h2>Recent decisions</h2>
    <table id="decisions-table">
      <thead><tr><th>when</th><th>current</th><th>target</th><th>action</th><th>reason</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

<script>
function fmtAge(epoch) {
  if (!epoch) return "never";
  const s = Math.max(0, Math.round(Date.now() / 1000 - epoch));
  if (s < 90) return s + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}
function num(v, digits) { return v === null || v === undefined ? "–" : Number(v).toFixed(digits); }

async function refresh() {
  let s;
  try {
    s = await (await fetch("/api/status")).json();
  } catch (e) {
    document.getElementById("subtitle").innerHTML = '<span class="err">status unavailable: ' + e + '</span>';
    return;
  }
  document.getElementById("title").textContent = s.host.label + " (" + s.host.spec + ")";
  const badge = '<span class="badge ' + s.mode.toLowerCase() + '">' + s.mode + '</span>';
  document.getElementById("subtitle").innerHTML = badge + " · daemon " + fmtAge(s.as_of) +
    (s.daemon_fresh ? "" : " (stale)") + (s.inference_active ? " · serving a request" : " · idle");
  document.getElementById("kpi-current").textContent = s.current_model || "none";
  document.getElementById("kpi-earned-24h").textContent = "$" + num(s.earnings_usd_24h, 2);
  document.getElementById("kpi-earned-1h").textContent = "$" + num(s.earnings_usd_1h, 4);

  const demandBody = document.querySelector("#demand-table tbody");
  demandBody.innerHTML = s.demand.map(function (r) {
    return "<tr><td>" + r.model + "</td><td>" + r.active_requests + "</td><td>" + r.warm_providers +
      "</td><td>" + num(r.pressure, 2) + "</td><td>" + num(r.output_usd_per_million, 2) +
      "</td><td>" + num(r.score, 3) + "</td><td><b>" + num(r.ema_score, 3) + "</b></td></tr>";
  }).join("");

  const bars = document.getElementById("serving-bars");
  const entries = Object.entries(s.serving_percentage_24h);
  bars.innerHTML = entries.length ? entries.map(function ([model, pct]) {
    return '<div class="bar-row"><div class="bar-label">' + model + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div>' + pct + '%</div></div>';
  }).join("") : "<i>not enough history yet</i>";

  const decisionsBody = document.querySelector("#decisions-table tbody");
  decisionsBody.innerHTML = s.recent_decisions.map(function (d) {
    return "<tr><td>" + fmtAge(d.observed_at) + "</td><td>" + (d.current_model || "–") + "</td><td>" +
      (d.target_model || "–") + "</td><td>" + d.action + (d.executed ? " ✓" : "") +
      "</td><td>" + d.reason + "</td></tr>";
  }).join("");
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
