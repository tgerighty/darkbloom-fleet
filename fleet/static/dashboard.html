<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkbloom-fleet</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem;
         background: light-dark(#f7f7f8, #17181c); color: light-dark(#1c1d21, #e7e8ea); }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  .sub { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.4rem; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; }
  .badge.observe { background: #2b6cb0; color: #fff; }
  .badge.live { background: #c0392b; color: #fff; }
  .host-block { margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid light-dark(#0002, #fff2); }
  .host-block:last-child { border-bottom: none; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.65; margin-bottom: 0.6rem;
       display: flex; align-items: center; gap: 0.8rem; }
  h2 select { font: inherit; text-transform: none; letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid light-dark(#0002, #fff2); }
  th { opacity: 0.6; font-weight: 500; }
  .scroll { max-height: 11.5rem; overflow-y: auto; }   /* ~5 rows */
  .scroll.tall { max-height: 21rem; }                  /* ~10 rows */
  .scroll thead th { position: sticky; top: 0; background: light-dark(#f7f7f8, #17181c); }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
  .bar-label { width: 12rem; font-size: 0.85rem; flex-shrink: 0; }
  .bar-track { flex: 1; background: light-dark(#0001, #fff1); border-radius: 4px; height: 0.9rem; overflow: hidden; }
  .bar-fill { height: 100%; background: light-dark(#2b6cb0, #5a9fe0); }
  .bar-fill.idle { background: light-dark(#a0a4ab, #5c6068); }
  .kpis { display: flex; gap: 2rem; }
  .kpi .value { font-size: 1.6rem; font-weight: 600; }
  .kpi .label { font-size: 0.8rem; opacity: 0.65; }
  .err { color: #c0392b; }
  code { font-size: 0.85em; }
</style>
</head>
<body>
  <h1>darkbloom-fleet</h1>
  <div class="sub" id="fleet-subtitle">loading…</div>
  <section><h2>Live demand (network)</h2>
    <table><thead><tr><th>model</th><th>active</th><th>warm</th><th>pressure</th><th>$/M</th><th>score</th><th>ema (20m)</th></tr></thead>
    <tbody id="demand"></tbody></table></section>
  <div id="hosts"></div>

<script type="module">
const TD = "</td><td>";
const TR = "<tr><td>";
const TR_END = "</td></tr>";
const WINDOWS = ["1h", "7h", "24h", "30d", "lifetime"];
let servingWindow = "24h";
let lastStatus = null;

function fmtAge(epoch) {
  if (!epoch) return "never";
  const s = Math.max(0, Math.round(Date.now() / 1000 - epoch));
  if (s < 90) return s + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}
function num(v, digits) { return v === null || v === undefined ? "–" : Number(v).toFixed(digits); }
function esc(v) { return v === null || v === undefined ? "" : String(v).replaceAll(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function mins(v) { return v === null || v === undefined ? "not yet" : v + " min"; }
function yes(v) { return v ? "yes" : "–"; }
function activityLabel(active) {
  if (active === null || active === undefined) return "state unknown";
  return active ? "serving a request" : "idle";
}

function renderDemand(rows) {
  return rows.map(function (r) {
    return TR + esc(r.model) + TD + r.active_requests + TD + r.warm_providers + TD + num(r.pressure, 2) + TD +
      num(r.output_usd_per_million, 2) + TD + num(r.score, 3) + "</td><td><b>" + num(r.ema_score, 3) + "</b></td></tr>";
  }).join("");
}

function renderServing(shares) {
  const entries = Object.entries(shares || {}).sort(function (a, b) { return (a[0] === "idle") - (b[0] === "idle") || b[1] - a[1]; });
  if (!entries.length) return "<i>not enough history yet</i>";
  return entries.map(function ([model, pct]) {
    return '<div class="bar-row"><div class="bar-label">' + esc(model) + '</div>' +
      '<div class="bar-track"><div class="bar-fill' + (model === "idle" ? " idle" : "") + '" style="width:' + pct + '%"></div></div>' +
      '<div>' + pct + '%</div></div>';
  }).join("");
}

function renderModels(r) {
  const modelRows = r.models.length ? r.models.map(function (m) {
    return TR + esc(m.model) + TD + yes(m.advertised) + TD + yes(m.warm) + TD + m.routable_providers + TD +
      fmtAge(m.last_served_at) + TR_END;
  }).join("") : "<tr><td colspan=5><i>no probe data yet</i></td></tr>";
  const session = r.session
    ? "daemon restarted " + fmtAge(r.session.started_at) + " · first request after " + mins(r.session.first_request_after_min) +
      " · any host routable after " + mins(r.session.any_host_routable_after_min)
    : "no session data";
  const held = r.trust_level && r.trust_level !== "hardware" ? " · no public traffic until hardware trust returns" : "";
  const trust = "trust: " + esc(r.trust_level || "unknown") + (r.trust_reason ? " (" + esc(r.trust_reason) + ")" : "") + held;
  const probeNote = "routable = coordinator self-route view for our own requests, account-wide (probed " + fmtAge(r.self_route_as_of) + ")";
  return '<section><h2>Models: advertised / warm / routable</h2><div class="sub">' + trust + '<br>' + esc(session) + '<br>' + esc(probeNote) + '</div>' +
    '<table><thead><tr><th>model</th><th>advertised</th><th>warm</th><th>routable providers</th><th>last served</th></tr></thead><tbody>' + modelRows + '</tbody></table></section>';
}

function renderDecisions(decisions) {
  const rows = decisions.map(function (d) {
    return TR + fmtAge(d.observed_at) + TD + esc(d.current_model || "–") + TD + esc(d.target_model || "–") + TD +
      esc(d.action) + (d.executed ? " ✓" : "") + TD + esc(d.reason) + TR_END;
  }).join("");
  return '<section><h2>Recent decisions</h2><div class="scroll"><table><thead><tr><th>when</th><th>current</th><th>target</th><th>action</th><th>reason</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></section>';
}

function renderEarnings(rows) {
  const body = rows.length ? rows.map(function (e) {
    return TR + fmtAge(e.created_at) + TD + esc(e.model) + TD + e.completion_tokens + TD +
      "$" + num(e.micro_usd / 1e6, 4) + TR_END;
  }).join("") : "<tr><td colspan=4><i>no payouts recorded yet</i></td></tr>";
  return '<section><h2>Recent payouts</h2><div class="sub">from this host&#39;s ledger, which is account-wide</div>' +
    '<div class="scroll tall"><table><thead><tr><th>when</th><th>model</th><th>completion tokens</th><th>paid</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></section>';
}

function renderHost(s, index) {
  const badge = '<span class="badge ' + s.mode.toLowerCase() + '">' + s.mode + '</span>';
  const subtitle = badge + " · daemon " + fmtAge(s.as_of) +
    (s.daemon_fresh ? "" : " (stale)") + " · " + activityLabel(s.inference_active);
  const r = s.routability || { models: [], session: null, self_route_as_of: null, last_served_at: null };
  const options = WINDOWS.map(function (w) {
    return '<option value="' + w + '"' + (w === servingWindow ? " selected" : "") + ">" + w + "</option>";
  }).join("");

  return '<div class="host-block">' +
    '<h1>' + esc(s.host.label) + ' (' + esc(s.host.spec) + ')</h1>' +
    '<div class="sub">' + subtitle + '</div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="value">' + esc(s.current_model || "none") + '</div><div class="label">current model</div></div>' +
      '<div class="kpi"><div class="value">' + fmtAge(r.last_served_at) + '</div><div class="label">last served</div></div>' +
      '<div class="kpi"><div class="value">$' + num(s.earnings_usd_24h, 2) + '</div><div class="label">$ earned / 24h</div></div>' +
      '<div class="kpi"><div class="value">$' + num(s.earnings_usd_1h, 4) + '</div><div class="label">$ earned / 1h</div></div>' +
    '</div>' +
    renderModels(r) +
    '<section><h2>Serving percentage <select data-serving-window="' + index + '">' + options + '</select></h2>' +
      '<div class="sub">share of the window actively serving a request, per model; idle = warm with no request, no model, or no data (1-minute samples)</div>' +
      '<div>' + renderServing((s.serving || {})[servingWindow]) + '</div></section>' +
    renderDecisions(s.recent_decisions) +
    renderEarnings(s.recent_earnings || []) +
  '</div>';
}

function render(s) {
  document.getElementById("fleet-subtitle").textContent = s.hosts.length + " host" + (s.hosts.length === 1 ? "" : "s") +
    " · refreshed " + new Date().toLocaleTimeString();
  // Demand is network-wide but each host records only its configured models: merge by model, newest sample wins.
  const byModel = new Map();
  s.hosts.forEach(function (h) { h.demand.forEach(function (r) {
    const seen = byModel.get(r.model);
    if (!seen || (r.observed_at || 0) > (seen.observed_at || 0)) byModel.set(r.model, r);
  }); });
  const demand = Array.from(byModel.values()).sort(function (a, b) { return (b.ema_score || 0) - (a.ema_score || 0); });
  document.getElementById("demand").innerHTML = renderDemand(demand);
  document.getElementById("hosts").innerHTML = s.hosts.map(renderHost).join("");
}

document.getElementById("hosts").addEventListener("change", function (event) {
  if (event.target.matches("select[data-serving-window]") && lastStatus) {
    servingWindow = event.target.value;
    render(lastStatus);
  }
});

async function refresh() {
  try {
    const response = await fetch("/api/status");
    if (!response.ok) throw new Error("HTTP " + response.status);
    lastStatus = await response.json();
  } catch (e) {
    document.getElementById("fleet-subtitle").innerHTML = '<span class="err">status unavailable: ' + esc(e) + '</span>';
    return;
  }
  render(lastStatus);
}
await refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
