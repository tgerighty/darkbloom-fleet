<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkbloom-fleet</title>
<style>
  :root { color-scheme: light dark; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 1400px; margin: 2rem auto; padding: 0 1rem;
         background: light-dark(#f5f5f7, #17181c); color: light-dark(#1c1d21, #e7e8ea); }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  .sub { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.4rem; }
  .fleet-bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
               gap: 0.6rem 1.2rem; margin-bottom: 1.4rem; }
  .fleet-bar .sub { margin: 0; }
  .fleet-bar select { font: inherit; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; }
  .badge.observe { background: #2b6cb0; color: #fff; }
  .badge.live { background: #c0392b; color: #fff; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.65; margin-bottom: 0.6rem;
       display: flex; align-items: center; gap: 0.8rem; }
  h2 select { font: inherit; text-transform: none; letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid light-dark(#0002, #fff2); }
  th { opacity: 0.6; font-weight: 500; }
  .scroll { max-height: 11.5rem; overflow-y: auto; }   /* ~5 rows */
  .scroll.tall { max-height: 21rem; }                  /* ~10 rows */
  .scroll thead th { position: sticky; top: 0; background: light-dark(#f5f5f7, #17181c); }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
  .bar-label { width: 12rem; font-size: 0.85rem; flex-shrink: 0; }
  .bar-track { flex: 1; background: light-dark(#0001, #fff1); border-radius: 4px; height: 0.9rem; overflow: hidden; }
  .bar-fill { height: 100%; background: light-dark(#2b6cb0, #5a9fe0); }
  .bar-fill.idle { background: light-dark(#a0a4ab, #5c6068); }
  .err { color: #c0392b; }
  code { font-size: 0.85em; }

  /* Per-host console cards */
  .cards { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 1100px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { background: light-dark(#fff, #1c1d21); border: 1px solid light-dark(#0002, #fff2);
          border-left: 3px solid light-dark(#d5d5da, #4a4b52); border-radius: 10px; overflow: hidden; }
  .card.earning { border-left-color: light-dark(#1c7c4a, #7fd3a6); }
  .card.stale, .card.off { border-left-color: light-dark(#c0392b, #e07a70); }
  .cards.stale-poll { outline: 1px solid #c0392b; }
  .card-head { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.8rem 1rem 0; }
  .card-head h1 { font-size: 1.05rem; margin: 0; }
  .card-head .sub { margin: 0; flex: 1; }
  .card-head .head-flags { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem;
                           align-self: center; }
  .badge.proposed { background: light-dark(#eeeef1, #2a2b30); color: light-dark(#333, #d0d1d4);
                    font-family: var(--mono); font-size: 0.68rem; padding: 0.1rem 0.45rem; }
  .band { padding: 0.55rem 1rem; margin-top: 0.6rem; font-size: 0.9rem; }
  .band.green { background: light-dark(#e6f4ec, #163b2a); color: light-dark(#1c7c4a, #7fd3a6); }
  .band.amber { background: light-dark(#fdf3df, #3a2d10); color: light-dark(#8a5a00, #d9a441); }
  .band.grey { background: light-dark(#eeeef1, #26272c); color: light-dark(#555, #9a9ca3); }
  .band.red { background: light-dark(#fdecea, #3b1614); color: light-dark(#a12622, #e07a70); }
  .band-line { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; }
  .band-line .mono { font-weight: 400; }
  .band-sub { font-size: 0.8rem; opacity: 0.85; margin-top: 0.15rem; }
  .card-body { padding: 0.4rem 1rem 1rem; }

  .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .gvalue { font-family: var(--mono); font-size: 0.85rem; }
  .gauges { display: flex; gap: 1.2rem; flex-wrap: wrap; margin: 0.8rem 0 0.3rem; }
  .gauge { flex: 1 1 7.5rem; min-width: 7rem; }
  .gauge .pair { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.2rem; }
  .gtrack { height: 4px; background: light-dark(#0001, #fff1); border-radius: 2px; overflow: hidden; display: flex; }
  .gtrack.wide { height: 8px; border-radius: 4px; }
  .gfill { height: 100%; background: light-dark(#1f1a5e, #8b86d9); }
  .gfill.good { background: light-dark(#1c7c4a, #7fd3a6); }
  .gfill.err { background: light-dark(#c0392b, #d6604f); }
  .gfill.cache { background: light-dark(#8b86d9, #55507f); }
  .gpu-row { display: flex; align-items: center; gap: 0.8rem; margin: 0.5rem 0; }
  .gpu-row .gtrack { flex: 1; }
  .gpu-row .gvalue { flex-shrink: 0; }

  .chips { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin: 0.45rem 0; }
  .chips .glabel { margin-right: 0.3rem; }
  .chip { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 1rem; font-family: var(--mono);
          font-size: 0.78rem; background: light-dark(#eeeef1, #2a2b30); }
  .chip.active { background: light-dark(#e8e8f5, #2c2c48); color: light-dark(#1f1a5e, #8b86d9);
                 border: 1px solid light-dark(#1f1a5e55, #8b86d955); }
  .chip.current { border: 1px solid light-dark(#1f1a5e55, #8b86d955); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 0.7rem 0; }
  .tile { background: light-dark(#f7f7f8, #232429); border-radius: 8px; padding: 0.45rem 0.7rem; }
  .tile .tvalue { font-family: var(--mono); font-size: 1.1rem; font-weight: 600; }
  .tile .tlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .tile .tsub { font-size: 0.72rem; opacity: 0.55; }

  details.fold { margin: 0.7rem 0; }
  .card > details.fold { margin: 0; padding: 0 1rem 0.8rem; }
  details.fold summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }

  /* Jobs · hourly buckets: terminal-style monospace panel. The eight model
     colours are a categorical set validated for CVD separation and contrast
     on the panel surface in both modes (dataviz palette checks). */
  pre.hourly { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; margin: 0;
               padding: 0.55rem 0.75rem; border-radius: 6px; overflow-x: auto;
               background: light-dark(#fafafc, #141519); }
  pre.hourly .m0 { color: light-dark(#2b6cb0, #4a90d9); }
  pre.hourly .m1 { color: light-dark(#b4552e, #c07a45); }
  pre.hourly .m2 { color: light-dark(#0a8f80, #2aa398); }
  pre.hourly .m3 { color: light-dark(#8a5a00, #b58a2f); }
  pre.hourly .m4 { color: light-dark(#c2547c, #d06f92); }
  pre.hourly .m5 { color: light-dark(#1c7c4a, #349267); }
  pre.hourly .m6 { color: light-dark(#5551b0, #8d86dd); }
  pre.hourly .m7 { color: light-dark(#c0392b, #d6604f); }
  pre.hourly .gap { opacity: 0.45; }  /* an hour the host served nothing */
  .slot-row { display: flex; align-items: baseline; gap: 0.8rem; padding: 0.22rem 0;
              border-bottom: 1px solid light-dark(#0001, #fff1); }
  .slot-row:last-child { border-bottom: none; }
  .slot-row .smodel { font-family: var(--mono); font-size: 0.82rem; min-width: 11rem; }
  .slot-row .sdetail { font-family: var(--mono); font-size: 0.78rem; opacity: 0.75; }
  .sbadge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.08rem 0.5rem;
            border-radius: 1rem; }
  .sbadge.run { background: light-dark(#e6f4ec, #163b2a); color: light-dark(#1c7c4a, #7fd3a6); }
  .sbadge.idle { background: light-dark(#eeeef1, #2a2b30); color: light-dark(#555, #9a9ca3); }
  .none { opacity: 0.6; font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>
  <h1>darkbloom-fleet</h1>
  <div class="fleet-bar">
    <div class="sub" id="fleet-subtitle" aria-live="polite">loading…</div>
    <label>Serving window
      <select id="serving-window" aria-label="Serving window">
        <option value="1h">1h</option>
        <option value="7h">7h</option>
        <option value="24h" selected>24h</option>
        <option value="30d">30d</option>
        <option value="lifetime">lifetime</option>
      </select>
    </label>
  </div>
  <div id="hosts" class="cards"></div>
  <section>
    <details class="fold">
      <summary>Live demand (network)</summary>
      <table><thead><tr><th>model</th><th>active</th><th>warm</th><th>pressure</th><th>$/M</th><th>score</th><th>ema (20m)</th></tr></thead>
      <tbody id="demand"></tbody></table>
    </details>
  </section>
  <script type="module" src="/static/dashboard.js?v=4"></script>
</body>
</html>
